<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Dashboard</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2;
    font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #time { font-size: 22vw; font-weight: 200; font-variant-numeric: tabular-nums; line-height: 1; }
  #date { font-size: 4vw; margin-top: 2vh; opacity: .8; text-transform: capitalize; }
  #note { position: fixed; bottom: 2vh; font-size: 1.6vw; opacity: .35; }
  html { touch-action: none; }
  .dot { position: fixed; width: 6vw; height: 6vw; margin: -3vw 0 0 -3vw; border-radius: 50%;
    background: rgba(255, 160, 0, .55); border: .3vw solid #ffa000; pointer-events: none; }
  #touch { position: fixed; top: 1.5vh; left: 1.5vw; font-size: 2vw; opacity: .7;
    font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="time">--:--</div>
<div id="date"></div>
<div id="note">Pàgina de prova empaquetada · toca la pantalla per provar el tàctil</div>
<div id="touch">sense tocs</div>
<script>
  function tick() {
    var now = new Date();
    document.getElementById('time').textContent =
      now.toLocaleTimeString('ca', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('date').textContent =
      now.toLocaleDateString('ca', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  tick();
  setInterval(tick, 1000);

  // Prova del tàctil: un punt allà on el WebView rep cada toc, amb les coordenades.
  var taps = 0;
  document.addEventListener('pointerdown', function (e) {
    taps++;
    var dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = e.clientX + 'px';
    dot.style.top = e.clientY + 'px';
    document.body.appendChild(dot);
    setTimeout(function () { dot.remove(); }, 4000);
    document.getElementById('touch').textContent =
      'toc ' + taps + ': x=' + Math.round(e.clientX) + ' y=' + Math.round(e.clientY) +
      ' · finestra ' + window.innerWidth + '×' + window.innerHeight;
  });
</script>
</body>
</html>
