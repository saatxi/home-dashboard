<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Dashboard</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2;
    font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #time { font-size: 22vw; font-weight: 200; font-variant-numeric: tabular-nums; line-height: 1; }
  #date { font-size: 4vw; margin-top: 2vh; opacity: .8; text-transform: capitalize; }
  #note { position: fixed; bottom: 2vh; font-size: 1.6vw; opacity: .35; }
</style>
</head>
<body>
<div id="time">--:--</div>
<div id="date"></div>
<div id="note">Pàgina de prova empaquetada</div>
<script>
  function tick() {
    var now = new Date();
    document.getElementById('time').textContent =
      now.toLocaleTimeString('ca', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('date').textContent =
      now.toLocaleDateString('ca', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
